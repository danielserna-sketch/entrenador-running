[project]
name = "entrenador-running"
version = "0.1.0"
description = "Entrenador de running con IA: Garmin Connect + WhatsApp + AWS, metodología Corriendo conCiencia"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "openai>=3.35",
    "garminconnect>=0.3.19",
    "boto3>=1.34",
    "httpx>=0.27",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,secretsmanager,ses,sqs]>=5",
    "ruff>=0.5",
    "fitdecode>=0.11.0",
]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
